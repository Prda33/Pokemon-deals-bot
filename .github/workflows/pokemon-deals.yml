name: Recherche bonnes affaires Pokemon

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: pokemon-deals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Chercher les annonces
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEARCH_QUERY: carte pokemon
          DISCOUNT_THRESHOLD: "25"
        run: python bot.py

      - name: Memoriser les annonces deja vues
        run: |
          if git diff --quiet -- state/seen.json; then
            exit 0
          fi
          git config user.name "poke-deals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          git commit -m "Mise a jour des annonces vues"
          git push
